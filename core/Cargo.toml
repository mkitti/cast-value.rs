[package]
name = "zarr-cast-value"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Core casting logic for the Zarr cast_value codec"
repository = "https://github.com/zarr-developers/cast-value.rs"
readme = "../README.md"

[features]
default = []
float16 = ["dep:half"]
# Disable all architecture-specific SIMD paths (AVX2, AVX, NEON, WASM SIMD128)
# and fall through to the generic pulp::WithSimd kernel on every target.
# Useful for codegen inspection: compare assembly with and without this flag.
no-arch-simd = []
# When combined with no-arch-simd, routes the fallback through generic_scalar
# (two-pass, hoisted-match approach) instead of the pulp::WithSimd kernel.
# Compare: `--features no-arch-simd` vs `--features no-arch-simd,scalar-simd`.
scalar-simd = ["no-arch-simd"]

[dependencies]
half = { version = "2", optional = true, features = ["num-traits"] }
num-traits = "0.2"
pulp = "0.22"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "conversions"
harness = false

[[bench]]
name = "comparison"
harness = false
